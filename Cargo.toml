[package]
authors = [
    "Eric Nowac <nowace@msoe.edu>",
]
categories = ["gba", "emulation"]
description = "web frontend for the gba-emu crate"
edition = "2018"
keywords = ["yew", "wasm", "wasm-bindgen", "web", "gba", "emulation"]
license = "MIT/Apache-2.0"
name = "gba-web-frontend"
readme = "README.md"
repository = "https://gitlab.com/msoe.edu/sdl/sd20/cgmmn/web-frontend"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
gba-emulator = {path = "../gba-emu"}
wasm-bindgen = "0.2"
yew = { version = "0.23", features = ["csr"] }
log = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"
gloo-file = "0.3"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[dependencies.web-sys]
version = "0.3"
features = [
  'AudioBuffer',
  'AudioBufferSourceNode',
  'AudioContext',
  'AudioDestinationNode',
  'AudioNode',
  'CanvasRenderingContext2d',
  'Document',
  'Element',
  'File',
  'FileList',
  'GainNode',
  'HtmlCanvasElement',
  'HtmlInputElement',
  'ImageData',
  'KeyboardEvent',
  'Performance',
  'Window',
]
